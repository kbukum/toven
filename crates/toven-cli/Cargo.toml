[package]
name = "toven-cli"
description = "Toven CLI observability layer: Human/Jsonl Reporter sinks, raw-output rendering, and exit mapping"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
toven-model.workspace = true
toven-ports.workspace = true
toven-core.workspace = true
toven-engine.workspace = true
toven-release.workspace = true
toven-exec.workspace = true
rskit-errors.workspace = true
rskit-version.workspace = true
rskit-cli = { workspace = true, features = ["interactive"] }
rskit-fs.workspace = true
rskit-process.workspace = true
rskit-util.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
toven-testkit.workspace = true

[features]
# Forward rskit-git's vendored OpenSSL (reached via the engine crates) for
# portable and cross-compiled release builds. Off by default.
vendored-openssl = [
    "toven-engine/vendored-openssl",
    "toven-release/vendored-openssl",
    "toven-core/vendored-openssl",
]

[lints]
workspace = true
