[package]
name = "toven-release"
description = "Toven release PLAN/APPLY tail — change detection, bumping, packaging, signing, hosted publishing, and federated release over the engine core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
toven-model.workspace = true
toven-ports.workspace = true
toven-core.workspace = true
toven-runtime.workspace = true
toven-semver.workspace = true
toven-version.workspace = true
rskit-errors.workspace = true
rskit-fs = { workspace = true, features = ["archive"] }
rskit-git.workspace = true
rskit-process.workspace = true
rskit-config.workspace = true
rskit-util.workspace = true
rskit-version.workspace = true
async-trait.workspace = true
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[features]
# Statically link a source-built OpenSSL into rskit-git's embedded git2
# backend, for portable and cross-compiled release builds. Off by default.
vendored-openssl = ["rskit-git/vendored-openssl"]

[dev-dependencies]
toven-testkit.workspace = true
toven-vcs.workspace = true
rskit-util.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
