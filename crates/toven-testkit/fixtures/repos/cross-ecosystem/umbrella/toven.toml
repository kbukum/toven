# A single project spanning three ecosystems (rust + go + command) under one
# `toven.toml`, for the umbrella `toven` binary: cross-ecosystem discovery,
# graph projection, PLAN, and APPLY.
[project]
name = "umbrella-multi-eco"

[ecosystems.rust]
manifests = ["Cargo.toml"]
run_strategy = "leaf-to-top"

[ecosystems.go]
modules = ["services/api/go.mod"]
run_strategy = "leaf-to-top"

[[ecosystems.command.modules]]
name = "tools"
root = "tools"

[ecosystems.command.tasks.build]
argv = ["echo", "command tools built"]

[ecosystems.rust.tasks.build]
argv = ["cargo", "build", "--manifest-path", "{module.manifest}", "{module.selector}", "{args}"]
fan_out = "batchable"
selector = ["-p", "{module.package}"]
shared_inputs = ["Cargo.lock"]

[ecosystems.rust.tasks.check]
argv = ["cargo", "check", "--manifest-path", "{module.manifest}", "{module.selector}", "{args}"]
fan_out = "batchable"
selector = ["-p", "{module.package}"]
shared_inputs = ["Cargo.lock"]

[ecosystems.rust.tasks.doc]
argv = ["cargo", "doc", "--manifest-path", "{module.manifest}", "{module.selector}", "{args}"]
fan_out = "batchable"
selector = ["-p", "{module.package}"]
shared_inputs = ["Cargo.lock"]

[ecosystems.rust.tasks.format]
argv = ["cargo", "fmt", "--manifest-path", "{module.manifest}", "--all", "{args}"]
fan_out = "whole-workspace"
shared_inputs = ["Cargo.lock"]

[ecosystems.rust.tasks.lint]
argv = ["cargo", "clippy", "--manifest-path", "{module.manifest}", "{module.selector}", "{args}"]
fan_out = "batchable"
selector = ["-p", "{module.package}"]
shared_inputs = ["Cargo.lock"]

[ecosystems.rust.tasks.run]
argv = ["cargo", "run", "--manifest-path", "{module.manifest}", "{module.selector}", "{args}"]
fan_out = "per-module"
persistent = true
selector = ["-p", "{module.package}"]
shared_inputs = ["Cargo.lock"]

[ecosystems.rust.tasks.test]
argv = ["cargo", "test", "--manifest-path", "{module.manifest}", "{module.selector}", "{args}"]
fan_out = "batchable"
selector = ["-p", "{module.package}"]
shared_inputs = ["Cargo.lock"]

[ecosystems.go.tasks.build]
argv = ["go", "-C", "{module.root}", "build", "{args}", "{module.selector}"]
fan_out = "per-module"
selector = ["./..."]
shared_inputs = ["go.sum", "go.work", "go.work.sum"]

[ecosystems.go.tasks.check]
argv = ["go", "-C", "{module.root}", "vet", "{args}", "{module.selector}"]
fan_out = "per-module"
selector = ["./..."]
shared_inputs = ["go.sum", "go.work", "go.work.sum"]

[ecosystems.go.tasks.doc]
argv = ["go", "-C", "{module.root}", "doc", "{args}"]
fan_out = "per-module"
shared_inputs = ["go.sum", "go.work", "go.work.sum"]

[ecosystems.go.tasks.format]
argv = ["go", "-C", "{module.root}", "fmt", "{args}", "{module.selector}"]
fan_out = "per-module"
selector = ["./..."]
shared_inputs = ["go.sum", "go.work", "go.work.sum"]

[ecosystems.go.tasks.lint]
argv = ["go", "-C", "{module.root}", "vet", "{args}", "{module.selector}"]
fan_out = "per-module"
selector = ["./..."]
shared_inputs = ["go.sum", "go.work", "go.work.sum"]

[ecosystems.go.tasks.run]
argv = ["go", "-C", "{module.root}", "run", ".", "{args}"]
fan_out = "per-module"
persistent = true
shared_inputs = ["go.sum", "go.work", "go.work.sum"]

[ecosystems.go.tasks.test]
argv = ["go", "-C", "{module.root}", "test", "{args}", "{module.selector}"]
fan_out = "per-module"
selector = ["./..."]
shared_inputs = ["go.sum", "go.work", "go.work.sum"]
