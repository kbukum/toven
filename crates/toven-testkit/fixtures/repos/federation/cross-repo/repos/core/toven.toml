# Federation member 'core'. Members cannot reach the umbrella's shared
# `_profiles` (includes may not traverse above the member's config root), and
# they exist to exercise federation status/sync — so the task surface stays a
# deliberate minimum instead of restating the full shared grammar.
[project]
name = "core"

[ecosystems.rust]
manifests = ["Cargo.toml"]
run_strategy = "leaf-to-top"

[ecosystems.rust.tasks.build]
argv = ["cargo", "build", "--manifest-path", "{module.manifest}", "{module.selector}", "{args}"]
fan_out = "batchable"
selector = ["-p", "{module.package}"]
shared_inputs = ["Cargo.lock"]

[ecosystems.rust.tasks.check]
argv = ["cargo", "check", "--manifest-path", "{module.manifest}", "{module.selector}", "{args}"]
fan_out = "batchable"
selector = ["-p", "{module.package}"]
shared_inputs = ["Cargo.lock"]
