# Sample single-ecosystem Toven app repo (plan/apply happy path).
[project]
name = "single-rust"

[toven]
include = ["_profiles/rust-tasks.toml"]

[ecosystems.rust]
manifests = ["Cargo.toml"]
run_strategy = "leaf-to-top"

# A named extra within the built-in `test` kind: addressed as `test-integration`,
# it must be selectable (`toven test-integration`) alongside the plain `test`.
# Deliberately repo-local (not in the shared profile): `single` is the
# named-extra exemplar; the other shapes keep the plain grammar.
[ecosystems.rust.tasks.test-integration]
kind = "test"
argv = ["cargo", "nextest", "run", "--manifest-path", "{module.manifest}", "{module.selector}", "{args}"]
fan_out = "per-module"
selector = ["-p", "{module.package}"]
shared_inputs = ["Cargo.lock"]
