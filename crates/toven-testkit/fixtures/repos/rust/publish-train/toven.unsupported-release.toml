# Variant of the default release config that keeps the legacy `token_env`
# field: release resolution must reject it (not-yet-honored) before any
# planning or mutation, proving a configured-but-inert setting fails closed.
[project]
name = "publish-train-rust"

[toven]
include = ["_profiles/rust-tasks.toml"]

[ecosystems.rust]
manifests = ["Cargo.toml"]
run_strategy = "leaf-to-top"

[ecosystems.rust.release]
strategy = "semver-cascade"
level = "minor"
dependent_version = "upgrade"
tag_format = "{module}/v{version}"
push = false
registry = "crates-io"
token_env = "CARGO_REGISTRY_TOKEN"
