# A release-configured train (`train-cli -> train-core`): ecosystem-level
# registry publication with a per-module override, for release plan/status
# scenarios (semver cascade, tag formats, publication mix).
[project]
name = "publish-train-rust"

[toven]
include = ["_profiles/rust-tasks.toml"]

[ecosystems.rust]
manifests = ["Cargo.toml"]
run_strategy = "leaf-to-top"

[ecosystems.rust.release]
strategy = "semver-cascade"
level = "minor"
dependent_version = "upgrade"
tag_format = "{module}/v{version}"
tag_message = "release {module} {version}"
commit_message = "chore: release {version}"
push = false
registry = "crates-io"
token_env = "CARGO_REGISTRY_TOKEN"

[ecosystems.rust.release.prerelease]
channels = ["alpha", "beta", "rc"]

[modules."rust:train-core".release]
level = "major"
tag_format = "core-v{version}"
