# Invalid prerequisites variant (persistent); see toven.toml for the module chain.
[project]
name = "prerequisites-command"

[toven]
include = ["_profiles/command-tasks.toml"]

[[ecosystems.command.modules]]
name = "core"
root = "core"

[[ecosystems.command.modules]]
name = "lib"
root = "lib"
depends_on = ["core"]

[[ecosystems.command.modules]]
name = "app"
root = "app"
depends_on = ["lib"]

[ecosystems.command.tasks.serve]
argv = ["echo", "command serve"]
persistent = true

[ecosystems.command.tasks.test]
argv = ["echo", "command test"]
depends_on = ["serve"]
