# Two command modules sharing the echo grammar, with one per-repo task
# override, for multi-module command PLAN/APPLY and `--module` selection.
[project]
name = "multi-task-command"

[toven]
include = ["_profiles/command-tasks.toml"]

[[ecosystems.command.modules]]
name = "web"
root = "web"

[[ecosystems.command.modules]]
name = "worker"
root = "worker"

# Overrides the shared grammar for this repo's test task.
[ecosystems.command.tasks.test]
argv = ["echo", "multi-task test override"]

# A named set: `toven verify` plans both tasks into one run.
[sets.verify]
tasks = ["build", "test"]

# Scoped to `web` only: a task list with `--module command:worker` skips them,
# while either alone (or both together) on `worker` is a typed error.
[ecosystems.command.tasks.lint]
argv = ["echo", "multi-task lint"]
modules = ["web"]

[ecosystems.command.tasks.audit]
argv = ["echo", "multi-task audit"]
modules = ["web"]
