[package]
name = "toven-vcs"
description = "Toven's focused git-mechanism crate: the single rskit-git-backed VCS adapter, the change foundation, and the per-repo reader-set fan-out"
version = "0.1.0-alpha.6"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
toven-model.workspace = true
toven-ports.workspace = true
toven-semver.workspace = true
rskit-errors.workspace = true
rskit-git.workspace = true

[features]
# Statically link a source-built OpenSSL into rskit-git's embedded git2
# backend, for portable and cross-compiled release builds. Off by default.
vendored-openssl = ["rskit-git/vendored-openssl"]

[dev-dependencies]
toven-testkit.workspace = true
rskit-fs.workspace = true

[lints]
workspace = true
