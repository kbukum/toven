[package]
name = "toven-engine"
description = "Toven engine orchestration — strict config Document, PLAN change selection, and APPLY execution over rskit ports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
toven-model.workspace = true
toven-ports.workspace = true
rskit-errors.workspace = true
rskit-fs = { workspace = true, features = ["watch", "archive"] }
rskit-git.workspace = true
rskit-process.workspace = true
rskit-worker.workspace = true
rskit-component.workspace = true
rskit-validation.workspace = true
rskit-config.workspace = true
rskit-codec.workspace = true
rskit-util.workspace = true
rskit-version.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
async-trait.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true

[features]
# Statically link a source-built OpenSSL into rskit-git's embedded git2
# backend, for portable and cross-compiled release builds. Off by default.
vendored-openssl = ["rskit-git/vendored-openssl"]

[dev-dependencies]
toven-testkit.workspace = true
rskit-util.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
