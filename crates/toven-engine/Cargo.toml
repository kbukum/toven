[package]
name = "toven-engine"
description = "Toven engine orchestration and concrete port adapters over the shared PLAN foundation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
toven-model.workspace = true
toven-ports.workspace = true
toven-core.workspace = true
toven-exec.workspace = true
rskit-errors.workspace = true
rskit-fs = { workspace = true, features = ["watch"] }
rskit-git.workspace = true
rskit-process.workspace = true
rskit-worker.workspace = true
rskit-component.workspace = true
rskit-config.workspace = true
rskit-util.workspace = true
toml.workspace = true
toml_edit.workspace = true
async-trait.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true

[features]
# Statically link a source-built OpenSSL into rskit-git's embedded git2
# backend, for portable and cross-compiled release builds. Off by default.
vendored-openssl = ["rskit-git/vendored-openssl"]

[dev-dependencies]
toven-testkit.workspace = true
rskit-util.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
