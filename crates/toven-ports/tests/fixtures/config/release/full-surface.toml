strategy = "semver-cascade"
level = "minor"
dependent_version = "upgrade"
tag_format = "{module}/v{version}"
tag_message = "release {module} {version}"
sign_tags = true
sign_format = "openpgp"
signing_key = "ABCD1234"
commit_message = "chore: release {version}"
push = false
remote = "upstream"
branches = ["main", "release"]
registry = "crates-io"
offline = true
token_env = "CARGO_REGISTRY_TOKEN"
readiness = ["deny", "audit"]

[prerelease]
channels = ["rc", "beta"]
branch_channels = { next = "beta" }

[changelog]
path = "CHANGELOG.md"
required = true

[sign]
enabled = true
signer = "release-bot"

[hooks]
pre = ["fmt-check"]
post = ["announce"]

[host]
forge = "github"
draft = false
prerelease = true
notes = "handcrafted release notes"
assets = ["target/toven/release/core.cdx.json"]
