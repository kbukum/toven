# Mixed train: registry libraries plus one tag-only binary app.
[project]
name = "mixed"

[ecosystems.rust.release]
tag_format = "v{version}"
registry = "crates-io"
offline = true

[ecosystems.rust.release.host]
forge = "github"

[modules."rust:app".release]
publish = false

[modules."rust:app".release.host]
forge = "github"
assets = ["dist/app-x86_64-unknown-linux-gnu.tar.gz", "dist/SHA256SUMS"]
