[package]
name = "toven-rust"
description = "Toven Rust ecosystem adapter — cargo-metadata discovery, init wizard task authoring, toolchain probe, crates.io release target"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
toven-model.workspace = true
toven-ports.workspace = true
rskit-errors.workspace = true
rskit-config.workspace = true
rskit-cli.workspace = true
rskit-codec.workspace = true
rskit-fs.workspace = true
rskit-git.workspace = true
rskit-version.workspace = true
rskit-util.workspace = true
serde.workspace = true
toml.workspace = true
toml_edit.workspace = true
cargo_metadata.workspace = true

[features]
