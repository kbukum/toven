[package]
name = "toven-model"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.94"
license = "MIT"
authors = ["Toven contributors"]
repository = "https://github.com/kbukum/toven"
description = "Shared Toven vocabulary: identity, graph, plan, and event types"
publish = false

[dependencies]
rskit-errors = { version = "0.1.0-alpha.1", path = "../../rskit/core/rskit-errors" }
rskit-validation = { version = "0.1.0-alpha.1", path = "../../rskit/core/rskit-validation" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
