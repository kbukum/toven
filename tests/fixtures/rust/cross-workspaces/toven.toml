[project]
name = "cross-workspaces"
root = "."

[profiles.rust]
adapter = "rust"
execution = "batch-ready"
module_arg_template = ["-p", "{module.package}"]
resource_group = "cargo:{project.root}"

[profiles.rust.discovery]
manifests = ["core/Cargo.toml", "contrib/Cargo.toml"]

[profiles.rust.tasks]
test = { argv = ["cargo", "test", "--manifest-path", "{module.manifest}", "{module.args}"] }

[scopes.contrib]
profile = "rust"
execution = "spawn-each"
module_arg_template = ["-p", "{module.package}"]
resource_group = "scope:{scope.root}:{module.package}"

[scopes.contrib.discovery]
manifest = "contrib/Cargo.toml"

[scopes.contrib.tasks]
test = { argv = ["cargo", "check", "--manifest-path", "{module.manifest}", "{module.args}"] }
