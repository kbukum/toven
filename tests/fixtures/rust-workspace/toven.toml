[project]
name = "fixture"
root = "."

[profiles.rust]
adapter = "rust"
execution = "batch-ready"
module_arg_template = ["-p", "{module.package}"]
resource_group = "cargo:{project.root}"

[profiles.rust.tasks]
test = { argv = ["cargo", "test", "--manifest-path", "{module.manifest}", "{module.args}", "{args}"] }
