[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
yanked = "deny"

[licenses]
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip-tree = [
    { crate = "rskit-config", reason = "rskit submodule crate uses path-only internal workspace dependencies", depth = 0 },
    { crate = "rskit-fs", reason = "rskit submodule crate uses path-only internal workspace dependencies", depth = 0 },
    { crate = "rskit-process", reason = "rskit submodule crate uses path-only internal workspace dependencies", depth = 0 },
    { crate = "rskit-validation", reason = "rskit submodule crate uses path-only internal workspace dependencies", depth = 0 },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
