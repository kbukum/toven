[project]
name = "smoke-cache"
root = "."

[profiles.rust]
adapter = "rust"
execution = "spawn-each"
module_arg_template = ["-p", "{module.package}"]
resource_group = "cargo:{project.root}"

[profiles.workspace]
adapter = "rust"
execution = "workspace-once"
resource_group = "cargo:{project.root}"

[profiles.rust.tasks]
stamp = { argv = ["sh", "-c", "echo stamp {module.package}"] }
arg-stamp = { argv = ["sh", "-c", "echo arg-stamp {module.package} \"$@\"", "sh", "{args}"], cache_args = true }
shared-stamp = { preset = "shared-stamp" }

[profiles.workspace.tasks]
workspace-stamp = { argv = ["sh", "-c", "echo workspace-once"] }
