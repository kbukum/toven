name: Supply Chain

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.94 --profile minimal
          rustup override set 1.94

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.19.0

      # `doctor` audits the whole resolved task graph, so its referenced tools
      # (ast-grep for structure, mdbook + mdbook-mermaid for docs-build) must be
      # present for the gate to pass — the single source of truth for provisioning.
      - name: Install task-graph tooling
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: ast-grep,mdbook,mdbook-mermaid

      - name: Doctor (required-tool gate)
        run: make doctor

      - name: Run dependency audit
        run: make deny

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.94 --profile minimal --component llvm-tools-preview --component rustfmt
          rustup override set 1.94

      - name: Install Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2.7.8

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version 0.8.5

      # The rust publish-train golden scenarios shell out to the plugin.
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked --version 0.5.9

      # `doctor`'s referenced tools (ast-grep for structure, mdbook +
      # mdbook-mermaid for docs-build) so the required-tool gate can pass.
      - name: Install task-graph tooling
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: ast-grep,mdbook,mdbook-mermaid

      - name: Doctor (required-tool gate)
        run: make doctor

      - name: Run coverage gate
        run: make coverage

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: rust

      - name: Autobuild
        uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3 # v4

      - name: Analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
