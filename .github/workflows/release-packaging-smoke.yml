name: Release packaging smoke

# Exercise the engine's release packaging verb on every supported runner OS,
# so its platform-specific paths — notably the Windows archive handling, now a
# pure-Rust rskit-fs zip path rather than a PowerShell fallback — are proven on
# a real runner before a gated release dispatch relies on them. Builds a
# host-native debug `toven` and packages it into its declared release archive.
# Runs only when the packaging engine, the release config, or the release
# workflow that drives it change.

on:
  pull_request:
    paths:
      - "crates/toven-engine/src/release/**"
      - "crates/toven-ports/src/config/release/**"
      - "toven.toml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-packaging-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-packaging-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.94"

jobs:
  package:
    name: Package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup override set "${RUST_VERSION}"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@72d126e709cad40056a62344eee609d696d62d33 # v2.7.8
        with:
          key: packaging-smoke-${{ matrix.os }}

      - name: Build host-native toven
        shell: bash
        run: cargo build --locked -p toven

      - name: Package the release archive
        shell: bash
        run: |
          target="$(rustc -vV | sed -n 's/^host: //p')"
          binary="target/debug/toven"
          if [[ "${target}" == *windows* ]]; then
            binary="${binary}.exe"
          fi
          cargo run --locked -p toven -- release package --target "${target}" --binary "${binary}" --output jsonl
          ls -la dist
