name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    env:
      # Use the nextest CI profile (retries + slow-timeout) for the
      # real-subprocess integration tests; `make` picks this up via NEXTEST_PROFILE ?=.
      NEXTEST_PROFILE: ci
    strategy:
      fail-fast: false
      matrix:
        rust:
          - "1.94"
          - "1.95"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${{ matrix.rust }}" --profile minimal --component clippy,rustfmt
          rustup override set "${{ matrix.rust }}"

      - name: Install Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@7e35be21c2b94d972b1143087fabc27d7dc881ef # v2.7.8

      - name: Install cargo-nextest
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2
        with:
          tool: cargo-nextest

      - name: Install ast-grep
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2
        with:
          tool: ast-grep

      - name: Show tool versions
        run: |
          rustc --version
          cargo --version
          cargo nextest --version
          ast-grep --version
          go version

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.19.0

      - name: Run checks
        run: make check
