name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust:
          - "1.94"
          - "1.95"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${{ matrix.rust }}" --profile minimal --component clippy,rustfmt
          rustup override set "${{ matrix.rust }}"

      - name: Install Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@72d126e709cad40056a62344eee609d696d62d33 # v2.7.8

      # Single authoritative install list, aligned to `toven doctor`'s report of
      # the resolved task graph's tools (cargo, ast-grep, mdbook) plus the cargo
      # plugins gates shell out to that `doctor` sees only as `cargo`:
      # cargo-nextest (test), cargo-deny (deny), cargo-cyclonedx (the rust
      # publish-train golden scenarios). mdbook + mdbook-mermaid back the
      # command-ecosystem `docs-build` gate the `doctor` audit requires.
      - name: Install task-graph tooling
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2
        with:
          tool: cargo-nextest,ast-grep,mdbook,mdbook-mermaid

      - name: Show tool versions
        run: |
          rustc --version
          cargo --version
          cargo nextest --version
          ast-grep --version
          mdbook --version
          go version

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.19.0

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked --version 0.5.9

      # `doctor` is the single source of truth for required tooling: fail fast
      # with the aggregated missing-tool report before the gate runs, so a
      # provisioning gap surfaces here rather than mid-`check`.
      - name: Doctor (required-tool gate)
        run: make doctor

      # The non-test gates (fmt-check, lint, structure, doc, deny,
      # verify-release-platform-filter, release-dry-run) plus doctests. The
      # nextest suite runs separately in the sharded `test` job below; together
      # they equal `make check`. Doctests are not sharded (nextest does not run
      # them) so they stay here, once per toolchain.
      - name: Run static checks
        run: make check-static

      - name: Run doctests
        run: make doctest

  test:
    name: Test ${{ matrix.rust }} (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    env:
      # Real-subprocess integration tests use the nextest CI profile (retries +
      # slow-timeout). Sharding with `--partition count:N/3` splits the suite
      # across runners for a wall-clock win without changing what runs; the union
      # of the three shards is the full suite. Coverage is preserved on both the
      # MSRV (1.94) and stable (1.95) toolchains.
      NEXTEST_PROFILE: ci
    strategy:
      fail-fast: false
      matrix:
        rust:
          - "1.94"
          - "1.95"
        shard:
          - 1
          - 2
          - 3

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${{ matrix.rust }}" --profile minimal
          rustup override set "${{ matrix.rust }}"

      - name: Install Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@72d126e709cad40056a62344eee609d696d62d33 # v2.7.8

      - name: Install cargo-nextest
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2
        with:
          tool: cargo-nextest

      - name: Run test shard
        run: cargo nextest run --workspace --all-targets --all-features --profile ci --partition count:${{ matrix.shard }}/3
