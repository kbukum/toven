name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    env:
      # Use the nextest CI profile (retries + slow-timeout) for the
      # real-subprocess integration tests; `make` picks this up via NEXTEST_PROFILE ?=.
      NEXTEST_PROFILE: ci
    strategy:
      fail-fast: false
      matrix:
        rust:
          - "1.94"
          - "1.95"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${{ matrix.rust }}" --profile minimal --component clippy,rustfmt
          rustup override set "${{ matrix.rust }}"

      - name: Install Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26"
          cache: false

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb # v2.7.8

      - name: Install cargo-nextest
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2
        with:
          tool: cargo-nextest

      - name: Show tool versions
        run: |
          rustc --version
          cargo --version
          cargo nextest --version
          go version

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.19.0

      - name: Run checks
        run: make check
