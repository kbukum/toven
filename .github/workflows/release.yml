name: Release

# Toven's own binary release pipeline (docs/self-hosting.md "Release approval
# pipeline"). This workflow never triggers on a `v*` tag push — it *creates*
# that tag itself, through `toven release publish`, so a tag-triggered run
# would race a preflight that fails closed on an already-existing tag. The
# only trigger is an explicit, human-dispatched run, and the mutating job is
# gated by the protected `release` GitHub environment (configure it once with
# required reviewers before the first dispatch).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

env:
  COSIGN_VERSION: v2.6.0
  RUST_VERSION: "1.94"

jobs:
  # Mutation-free preview: the exact plan, readiness, SBOM, and dependency
  # graphs a real publish would use, preserved as review evidence for the
  # `release` environment's required reviewers before they approve `publish`.
  preview:
    name: Release preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup override set "${RUST_VERSION}"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2.7.8

      - name: Install cargo-cyclonedx
        # Version-pinned but not `--locked`: cargo-cyclonedx 0.5.9's own
        # lockfile pins a yanked `xml-rs`, so `--locked` warns and can fail;
        # resolving fresh picks the current non-yanked patch.
        run: cargo install cargo-cyclonedx --version 0.5.9

      - name: Preview release plan, readiness, SBOM, and dependency graphs
        run: make release-plan

      - name: Preview publication rehearsal
        run: cargo run --locked -p toven -- release publish --dry-run --output jsonl | tee release-preview.jsonl

      - name: Upload preview evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-preview
          path: |
            release-preview.jsonl
            target/toven/release/sbom/**
            target/toven/release/depgraphs/**
          if-no-files-found: error
          retention-days: 14

  # Real per-target binary build. Each entry packages a runnable `toven` into
  # the fixed dist/ archive name toven.toml's `release.host.assets` declares
  # (`toven release package`). Every target builds with the `vendored-openssl`
  # feature, so rskit-git's embedded git2 backend links a source-built OpenSSL
  # (libgit2 is already vendored) and the released binaries carry no host
  # OpenSSL dependency; the cross-compiled Linux ARM64 target builds through
  # `cross` for a matching glibc.
  build:
    name: Build ${{ matrix.target }}
    needs: preview
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup override set "${RUST_VERSION}"
          rustup target add ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2.7.8
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: cross

      - name: Build (native)
        if: ${{ !matrix.use_cross }}
        shell: bash
        run: cargo build --locked --release -p toven --features vendored-openssl --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use_cross
        shell: bash
        run: cross build --locked --release -p toven --features vendored-openssl --target ${{ matrix.target }}

      - name: Package release archive
        shell: bash
        run: cargo run --locked -p toven -- release package --target ${{ matrix.target }} --output jsonl

      - name: Upload packaged archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-archive-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # Assemble every per-target archive into one dist/, stage the umbrella
  # app's CycloneDX SBOM alongside, produce the combined SHA256SUMS (covering
  # every archive and the SBOM) and its keyless Sigstore/cosign signature, then
  # presence-check the whole declared asset set — the exact fixed-name file set
  # toven.toml's `release.host.assets` declares, every one engine-produced
  # (`toven release sbom | checksums | sign | verify`).
  assemble:
    name: Assemble release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # cosign keyless signing (Sigstore OIDC)

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup override set "${RUST_VERSION}"

      - name: Install cargo-cyclonedx
        # Version-pinned but not `--locked`: cargo-cyclonedx 0.5.9's own
        # lockfile pins a yanked `xml-rs`, so `--locked` warns and can fail;
        # resolving fresh picks the current non-yanked patch.
        run: cargo install cargo-cyclonedx --version 0.5.9

      - name: Download every packaged archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-archive-*
          path: dist
          merge-multiple: true

      - name: Stage the CycloneDX SBOM into its declared asset
        run: cargo run --locked -p toven -- release sbom --out-dir target/toven/release/sbom --output jsonl

      - name: Generate combined checksums
        run: cargo run --locked -p toven -- release checksums --output jsonl

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign the checksums file (keyless Sigstore)
        run: cargo run --locked -p toven -- release sign --output jsonl

      - name: Presence-check the assembled release asset set
        run: cargo run --locked -p toven -- release verify --no-run --output jsonl

      - name: List assembled release assets
        run: ls -la dist

      - name: Upload assembled release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # The one mutating step: creates the immutable version tag and the hosted
  # GitHub Release with the assembled assets attached. Gated by the protected
  # `release` environment's required reviewers — this is the "explicit human
  # approval immediately before mutation" the plan requires.
  publish:
    name: Publish
    needs: assemble
    runs-on: ubuntu-latest
    environment: release
    permissions:
      attestations: write # build provenance for the published artifacts
      contents: write
      id-token: write # provenance attestation (Sigstore OIDC)
    outputs:
      tag: ${{ steps.published-tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup override set "${RUST_VERSION}"

      - name: Download assembled release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist

      # The release engine creates the version commit and annotated tags through
      # libgit2, which builds the committer/author signature from git config.
      # `actions/checkout` configures the auth token but not an identity, so
      # without this step `repo.signature()` fails and the publish aborts before
      # committing. Use the GitHub Actions bot identity for the release commit.
      - name: Configure git identity for the release commit and tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish the release
        env:
          # Both names are recognized by Toven's default `[toven.git]`
          # `push_token_env`; the embedded git backend reads whichever is set to
          # authenticate the tag/branch push to the protected branch.
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          cargo run --locked -p toven -- release publish --yes --output jsonl | tee release-publish.jsonl

      # The publish step above creates the annotated release tag on HEAD, so the
      # most recent reachable tag is exactly what was just published. Surface it
      # as a job output for the downstream package-manager publish, independent
      # of tag-format config or Cargo.toml parsing.
      - name: Capture the published tag
        id: published-tag
        run: |
          set -euo pipefail
          tag="$(git describe --tags --abbrev=0)"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      # Build provenance is cut here by GitHub's trusted builder over the exact
      # published file set: `SHA256SUMS` lists every archive and the SBOM, so
      # attesting its checksum subjects attests them all. Toven does not create
      # attestations — it verifies them (next step).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      # Provenance covers only artifacts that were actually approved and
      # published. Toven's own `release provenance` verb (argv-only over
      # `gh attestation verify`, read-only) asserts that every published subject
      # now carries the attestation cut above, failing closed if any is missing.
      - name: Verify build provenance through Toven
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo run --locked -p toven -- release provenance --output jsonl | tee release-provenance.jsonl

      - name: Upload publish record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-publish-record
          path: |
            release-publish.jsonl
            release-provenance.jsonl
          if-no-files-found: error
          retention-days: 90

  # Download every published asset back from the hosted Release and prove it
  # is exactly what was approved: `toven release verify --download` verifies the
  # keyless Sigstore signature on `SHA256SUMS` first, then checksum-verifies
  # every published archive against the now-trusted manifest. The keyless
  # identity/issuer it matches against come from `[…release.sign]` in
  # toven.toml. `--no-run` skips execution: the verb verifies the whole declared
  # asset set at once, and no single hosted runner can execute all five targets
  # (two Linux, two macOS, one Windows).
  verify:
    name: Verify published assets
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup override set "${RUST_VERSION}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Download and verify every published asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo run --locked -p toven -- release verify --download --no-run --output jsonl

  # Project the just-published, verified release into the package managers
  # (Homebrew tap, Scoop bucket). This runs only after `publish` and `verify`
  # succeed, in the same dispatched pipeline, because the `release: published`
  # event never fires for a `GITHUB_TOKEN`-authored release (see
  # publish-packages.yml). It is a no-op unless `HOMEBREW_TAP_TOKEN` is set.
  publish-packages:
    name: Publish package managers
    needs: [publish, verify]
    uses: ./.github/workflows/publish-packages.yml
    with:
      version: ${{ needs.publish.outputs.tag }}
    secrets: inherit
