name: Release Readiness

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COSIGN_VERSION: v2.6.0
  REQUIRE_PUBLISHABLE_PACKAGE: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
  RUST_VERSION: "1.94"

jobs:
  crate-dry-run:
    name: Crate dry run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup override set "${RUST_VERSION}"

      - name: Run release dry run
        run: make release-dry-run CARGO_PACKAGE_DIRTY_FLAG=

  release-artifacts:
    name: Release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup override set "${RUST_VERSION}"

      - name: Build release artifacts
        run: make release-artifacts CARGO_PACKAGE_DIRTY_FLAG=

      - name: Upload release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-artifacts
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          format: cyclonedx-json
          artifact-name: toven-sbom.cdx.json
          output-file: toven-sbom.cdx.json
          upload-artifact: true
          upload-release-assets: false

  signing-readiness:
    name: Signing readiness
    runs-on: ubuntu-latest

    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Verify cosign installation
        run: |
          cosign version
          cosign sign-blob --help >/dev/null

  provenance:
    name: Provenance
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - release-artifacts
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - name: Build release artifacts
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup override set "${RUST_VERSION}"
          make release-artifacts CARGO_PACKAGE_DIRTY_FLAG=

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-checksums: dist/SHA256SUMS
