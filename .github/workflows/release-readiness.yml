name: Release Readiness

# Non-mutating release-readiness preview. It runs on pull requests, on pushes
# to `main`, and on manual dispatch — never on a `v*` tag. Real release tags are
# created by `toven release publish` inside the gated `.github/workflows/release.yml`
# using `GITHUB_TOKEN`, which by design never triggers another workflow, so a
# `tags: v*` trigger here would be unreachable on a real release and only
# duplicate release.yml's own `preview` job.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COSIGN_VERSION: v2.6.0
  RUST_VERSION: "1.94"

jobs:
  crate-dry-run:
    name: Crate dry run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup override set "${RUST_VERSION}"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2.7.8

      - name: Run release dry run
        run: make release-dry-run

  release-plan:
    name: Release plan preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup override set "${RUST_VERSION}"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2.7.8

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked --version 0.5.9

      - name: Preview release plan, readiness, SBOM, and dependency graphs
        run: make release-plan

      # `make release-plan` runs `toven release sbom`, so the CycloneDX SBOM is
      # produced by Toven's own engine verb — the single source of SBOM truth,
      # the same artifact `release.yml` ships — reusing the binary this job
      # already built instead of a second job or a divergent SBOM toolchain.
      - name: Upload the release SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: toven-sbom
          path: target/toven/release/sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 7

  release-archive:
    name: Release archive
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup override set "${RUST_VERSION}"

      - name: Build the release archive
        run: |
          target="$(rustc -vV | sed -n 's/^host: //p')"
          cargo build --locked --release -p toven --target "${target}"
          cargo run --locked -p toven -- release package --target "${target}" --output jsonl

      - name: Upload the release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-archive
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  signing-readiness:
    name: Signing readiness
    runs-on: ubuntu-latest

    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Verify cosign installation
        run: |
          cosign version
          cosign sign-blob --help >/dev/null
