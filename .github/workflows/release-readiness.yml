name: Release Readiness

# Non-mutating release-readiness preview. It runs on pull requests, on pushes
# to `main`, and on manual dispatch — never on a `v*` tag. Real release tags are
# created by `toven release publish` inside the gated `.github/workflows/release.yml`
# using `GITHUB_TOKEN`, which by design never triggers another workflow, so a
# `tags: v*` trigger here would be unreachable on a real release and only
# duplicate release.yml's own `preview` job.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COSIGN_VERSION: v2.6.0
  RUST_VERSION: "1.94"

jobs:
  crate-dry-run:
    name: Crate dry run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup override set "${RUST_VERSION}"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@7e35be21c2b94d972b1143087fabc27d7dc881ef # v2.7.8

      - name: Run release dry run
        run: make release-dry-run

  release-plan:
    name: Release plan preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup override set "${RUST_VERSION}"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@7e35be21c2b94d972b1143087fabc27d7dc881ef # v2.7.8

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked --version 0.5.9

      - name: Preview release plan, readiness, SBOM, and dependency graphs
        run: make release-plan

  release-artifacts:
    name: Release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup override set "${RUST_VERSION}"

      - name: Build release artifacts
        run: make release-artifacts

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          submodules: recursive

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          artifact-name: toven-sbom.cdx.json
          output-file: toven-sbom.cdx.json
          upload-artifact: true
          upload-release-assets: false

  signing-readiness:
    name: Signing readiness
    runs-on: ubuntu-latest

    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Verify cosign installation
        run: |
          cosign version
          cosign sign-blob --help >/dev/null
