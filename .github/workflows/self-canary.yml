name: Self-canary

# Toven dogfooding the binary Toven itself produces: build the release binary,
# package it with `toven release package` (the exact artifact the release ships),
# then run Toven's own gates and release previews *through that self-generated
# binary* rather than a source `cargo run` or a downloaded release. This proves,
# on every push to main, that the binary Toven builds and packages can drive
# every job Toven is built for.
#
# It deliberately does not download a published release: the published artifact
# is already re-verified by `release.yml`'s `verify` job (`toven release verify
# --download`), and the downstream install contract is exercised by
# `scripts/install-toven.sh`. This canary's unique signal is that the
# self-produced binary runs Toven's whole toven-driven gate — including the
# `format-check` and `vuln` mapped tasks that `make check` otherwise gates
# natively — plus the full mutation-free release preview surface.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-canary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.94"
  TARGET: x86_64-unknown-linux-gnu

jobs:
  dogfood:
    name: Dogfood the self-generated binary
    runs-on: ubuntu-latest
    # nextest CI profile (retries + slow-timeout) for the real-subprocess
    # integration tests, read by the toven-driven `test` gate via the Makefile.
    env:
      NEXTEST_PROFILE: ci

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # The rskit build submodule is a path dependency, so the binary must
          # be compiled with submodules present; full history feeds the
          # release-preview change detection.
          submodules: recursive
          fetch-depth: 0

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy,rustfmt,llvm-tools-preview
          rustup override set "${RUST_VERSION}"
          rustup target add "${TARGET}"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@72d126e709cad40056a62344eee609d696d62d33 # v2.7.8

      # Tools the mapped gates shell out to: nextest (test), llvm-cov (coverage),
      # cargo-audit (vuln), cargo-cyclonedx (release sbom preview).
      - name: Install gate tooling
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2
        with:
          tool: cargo-nextest,cargo-llvm-cov,cargo-audit
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked --version 0.5.9

      # 1) Build the release binary the same way the release ships it (vendored
      #    OpenSSL so the artifact carries no host OpenSSL dependency), then 2)
      #    package it into its declared dist/ archive with Toven's own verb.
      - name: Build the release binary
        run: cargo build --locked --release -p toven --features vendored-openssl --target "${TARGET}"

      - name: Package the binary with `toven release package`
        run: cargo run --locked -p toven --features vendored-openssl -- release package --target "${TARGET}" --output jsonl

      # Extract the packaged archive and pin the self-generated binary for every
      # step below — nothing after this point uses a source build.
      - name: Extract and select the self-generated binary
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/toven-bin"
          tar -xzf "dist/toven-${TARGET}.tar.gz" -C "${RUNNER_TEMP}/toven-bin"
          echo "TOVEN_BIN=${RUNNER_TEMP}/toven-bin/toven" >> "${GITHUB_ENV}"
          echo "${RUNNER_TEMP}/toven-bin" >> "${GITHUB_PATH}"

      - name: Show the self-generated version
        run: toven --version

      # Toven planning its own work through the self-generated binary.
      - name: Discover and plan
        run: |
          toven modules
          toven tasks
          toven graph
          toven plan check

      # Every toven-driven gate, routed through the self-generated binary via the
      # Makefile's TOVEN override — the same entrypoint a maintainer uses with
      # `make TOVEN=toven ...`.
      - name: Toven-driven gates through the self-generated binary
        run: make TOVEN="${TOVEN_BIN}" lint test doc coverage affected

      # The two concerns `make check` gates natively also have Toven mapped tasks;
      # prove they run through the self-generated binary too, so no purpose Toven
      # is built for is left un-dogfooded.
      - name: Mapped format-check and vuln through Toven
        run: |
          "${TOVEN_BIN}" run format-check
          "${TOVEN_BIN}" run vuln

      # Full mutation-free release preview surface.
      - name: Release previews through the self-generated binary
        run: |
          make TOVEN="${TOVEN_BIN}" release-plan
          "${TOVEN_BIN}" release publish --dry-run --output jsonl | tee release-preview.jsonl

      - name: Upload the release preview evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: self-canary-release-preview
          path: release-preview.jsonl
          if-no-files-found: error
          retention-days: 14
