[project]
name = "toven"
root = "."
base_ref = "origin/main"

# Smart defaults fill in tasks, run strategy, and toolchain probes.
# Uncomment to override, e.g.:
#   run_strategy = "leaf-to-top"
[ecosystems.rust]
manifests = "auto"

[ecosystems.rust.coverage]
changed_line = 85.0
enforcement = "advisory"
function = 80.0
line = 80.0
region = 70.0

# Toven ships as a single, signed, tag-only hosted binary release — not a set of
# per-crate registry packages. Every workspace crate is `publish = false` and,
# because no `registry` is set here, resolves to the tag-only publication policy
# (versioned and tagged, never published to crates.io). The whole workspace
# shares one version, so `tag_format = "v{version}"` collapses the crates onto a
# single repository tag (e.g. `v0.1.0`) — the one release train for the binary —
# instead of the per-crate `{ecosystem}/{module}@{version}` default.
#
# The hosted GitHub Release carries the per-target `toven` binary archives, a
# combined `SHA256SUMS`, its keyless Sigstore/cosign signature and certificate,
# and a CycloneDX SBOM. `host.assets` in this port is a fixed list of exact,
# non-templated project-relative paths (no globbing, no version placeholder —
# see crates/toven-ports/src/config/release/host.rs), so archive names never
# embed the release version; the version lives in the release tag and title
# instead. `.github/workflows/release.yml` builds every target on a `v*` tag
# push, assembles this exact `dist/` file set, then runs `toven release
# publish` so the resolved paths below exist before the hosted Release is cut.
# Build provenance is attached separately as a GitHub attestation, not as a
# listed asset.
[ecosystems.rust.release]
readiness = ["clean-tree"]
tag_format = "v{version}"

[ecosystems.rust.release.host]
forge = "github"
assets = [
  "dist/toven-x86_64-unknown-linux-gnu.tar.gz",
  "dist/toven-aarch64-unknown-linux-gnu.tar.gz",
  "dist/toven-x86_64-apple-darwin.tar.gz",
  "dist/toven-aarch64-apple-darwin.tar.gz",
  "dist/toven-x86_64-pc-windows-msvc.zip",
  "dist/SHA256SUMS",
  "dist/SHA256SUMS.sig",
  "dist/SHA256SUMS.pem",
  "dist/toven-sbom.cdx.json",
]

[ecosystems.rust.release.prerelease]
channels = ["alpha"]

[ecosystems.rust.tasks.build]
argv = ["cargo", "build", "--manifest-path", "{module.manifest}", "{module.selector}", "{args}"]
fan_out = "batchable"
selector = ["-p", "{module.package}"]
shared_inputs = ["Cargo.lock"]

[ecosystems.rust.tasks.check]
argv = ["cargo", "check", "--manifest-path", "{module.manifest}", "{module.selector}", "{args}"]
fan_out = "batchable"
selector = ["-p", "{module.package}"]
shared_inputs = ["Cargo.lock"]

[ecosystems.rust.tasks.coverage]
argv = ["cargo", "llvm-cov", "--manifest-path", "{module.manifest}", "--workspace", "--lcov", "--output-path", "target/toven/coverage/rust-{module.name}.lcov", "{args}"]
cacheable = false
fan_out = "whole-workspace"
kind = "coverage"
shared_inputs = ["Cargo.lock"]

[ecosystems.rust.tasks.doc]
argv = ["cargo", "doc", "--manifest-path", "{module.manifest}", "{module.selector}", "--no-deps", "{args}"]
fan_out = "batchable"
selector = ["-p", "{module.package}"]
shared_inputs = ["Cargo.lock"]

[ecosystems.rust.tasks.format]
argv = ["cargo", "fmt", "--manifest-path", "{module.manifest}", "--all", "{args}"]
cacheable = false
fan_out = "whole-workspace"
shared_inputs = ["Cargo.lock"]

[ecosystems.rust.tasks.format-check]
argv = ["cargo", "fmt", "--manifest-path", "{module.manifest}", "--all", "--check", "{args}"]
fan_out = "whole-workspace"
kind = "format"
shared_inputs = ["Cargo.lock"]

[ecosystems.rust.tasks.lint]
argv = ["cargo", "clippy", "--manifest-path", "{module.manifest}", "{module.selector}", "{args}"]
fan_out = "batchable"
selector = ["-p", "{module.package}"]
shared_inputs = ["Cargo.lock"]

[ecosystems.rust.tasks.run]
argv = ["cargo", "run", "--manifest-path", "{module.manifest}", "{module.selector}", "{args}"]
fan_out = "per-module"
persistent = true
selector = ["-p", "{module.package}"]
shared_inputs = ["Cargo.lock"]

[ecosystems.rust.tasks.test]
argv = ["cargo", "nextest", "run", "--no-tests=pass", "--manifest-path", "{module.manifest}", "{module.selector}", "{args}"]
fan_out = "batchable"
selector = ["-p", "{module.package}"]
shared_inputs = ["Cargo.lock"]

[ecosystems.rust.tasks.vuln]
argv = ["cargo", "audit", "--file", "{workspace.root}/Cargo.lock", "{args}"]
fan_out = "whole-workspace"
shared_inputs = ["Cargo.lock"]
