[project]
name = "toven"
root = "."
base_ref = "origin/main"

# Smart defaults fill in tasks, run strategy, and toolchain probes.
# Uncomment to override, e.g.:
#   run_strategy = "leaf-to-top"
[ecosystems.rust]
manifests = "auto"

[ecosystems.rust.coverage]
changed_line = 85.0
enforcement = "advisory"
function = 80.0
line = 80.0
region = 70.0

# Toven ships as a single, signed, tag-only hosted binary release — not a set of
# per-crate registry packages. Every workspace crate is `publish = false` and,
# because no `registry` is set here, resolves to the tag-only publication policy
# (versioned and tagged, never published to crates.io). The whole workspace
# shares one version, so `tag_format = "v{version}"` collapses the crates onto a
# single repository tag (e.g. `v0.1.0`) — the one release train for the binary —
# instead of the per-crate `{ecosystem}/{module}@{version}` default.
#
# The hosted GitHub Release carries the per-target `toven` binary archives, a
# combined `SHA256SUMS`, its keyless Sigstore/cosign bundle, and a CycloneDX
# SBOM. `host.assets` in this port is a fixed list of exact,
# non-templated project-relative paths (no globbing, no version placeholder —
# see crates/toven-ports/src/config/release/host.rs), so archive names never
# embed the release version; the version lives in the release tag and title
# instead. The manually dispatched `.github/workflows/release.yml` builds
# every target, assembles this exact `dist/` file set, then runs `toven
# release publish` so the resolved paths below exist before the hosted
# Release is cut.
# Build provenance is attached separately as a GitHub attestation, not as a
# listed asset.
[ecosystems.rust.release]
readiness = ["clean-tree"]
tag_format = "v{version}"
# Cut exactly `v${Cargo.toml version}`: the reviewed version/CHANGELOG pull
# request is the version decision, so the tag the engine cuts equals the
# workspace version by construction (no computed semver bump past the declared
# manifest, which is what lets successive `0.1.0-alpha.N` prereleases be cut).
strategy = "manifest"
# `main` is protected and rejects direct pushes, so the release job pushes only
# the release tag; the version/CHANGELOG commit lands on `main` through the
# normal reviewed pull-request flow.
push_branch = false

# Sign the release surface: `toven release sign` produces the keyless
# Sigstore/cosign bundle over `SHA256SUMS` (no `signer` selects the keyless
# default), and `toven release verify --download` fails closed unless the
# downloaded bundle's certificate matches this keyless identity regexp and OIDC
# issuer — the release workflow ref and GitHub's Actions token issuer. Neither
# value is a secret.
[ecosystems.rust.release.sign]
enabled = true
identity = "https://github.com/kbukum/toven/.github/workflows/release.yml@.*"
issuer = "https://token.actions.githubusercontent.com"

[ecosystems.rust.release.host]
forge = "github"
assets = [
  "dist/toven-x86_64-unknown-linux-gnu.tar.gz",
  "dist/toven-aarch64-unknown-linux-gnu.tar.gz",
  "dist/toven-x86_64-apple-darwin.tar.gz",
  "dist/toven-aarch64-apple-darwin.tar.gz",
  "dist/toven-x86_64-pc-windows-msvc.zip",
  "dist/SHA256SUMS",
  "dist/SHA256SUMS.bundle",
  "dist/toven-sbom.cdx.json",
]

[ecosystems.rust.release.prerelease]
channels = ["alpha"]

[ecosystems.rust.tasks.build]
argv = ["cargo", "build", "--manifest-path", "{module.manifest}", "{module.selector}", "{args}"]
fan_out = "batchable"
selector = ["-p", "{module.package}"]
shared_inputs = ["Cargo.lock"]

[ecosystems.rust.tasks.check]
argv = ["cargo", "check", "--manifest-path", "{module.manifest}", "{module.selector}", "{args}"]
fan_out = "batchable"
selector = ["-p", "{module.package}"]
shared_inputs = ["Cargo.lock"]

[ecosystems.rust.tasks.coverage]
argv = ["cargo", "llvm-cov", "--manifest-path", "{module.manifest}", "--workspace", "--lcov", "--output-path", "target/toven/coverage/rust-{module.name}.lcov", "{args}"]
cacheable = false
fan_out = "whole-workspace"
kind = "coverage"
shared_inputs = ["Cargo.lock"]

# Repo-level opt-in gate: cargo-deny needs a per-repo `deny.toml`, so it is a
# declared rust task rather than a Rust-adapter default. Whole-workspace like
# `vuln` — one resolved graph per workspace — and `kind = "lint"` since `deny`
# is not a name-recognized kind. `deny.toml` joins the shared inputs so a policy
# edit re-runs the gate.
[ecosystems.rust.tasks.deny]
argv = ["cargo", "deny", "check", "advisories", "bans", "licenses", "sources", "{args}"]
fan_out = "whole-workspace"
kind = "lint"
shared_inputs = ["Cargo.lock", "deny.toml"]

[ecosystems.rust.tasks.doc]
argv = ["cargo", "doc", "--manifest-path", "{module.manifest}", "{module.selector}", "--no-deps", "{args}"]
fan_out = "batchable"
selector = ["-p", "{module.package}"]
shared_inputs = ["Cargo.lock"]

# nextest (the `test` task) cannot execute documentation tests, so the Rust
# adapter's `doctest` default runs `cargo test --doc`. A doctest is semantically
# a test, so `kind = "test"` reuses the Test kind (coverage/affected grouping)
# while the distinct `doctest` name keeps it from colliding with the nextest
# `test` task. Mirrors the `toven-rust` adapter default; Go has no analog.
[ecosystems.rust.tasks.doctest]
argv = ["cargo", "test", "--doc", "--manifest-path", "{module.manifest}", "{module.selector}", "{args}"]
fan_out = "batchable"
kind = "test"
selector = ["-p", "{module.package}"]
shared_inputs = ["Cargo.lock"]

[ecosystems.rust.tasks.format]
argv = ["cargo", "fmt", "--manifest-path", "{module.manifest}", "--all", "{args}"]
cacheable = false
fan_out = "whole-workspace"
shared_inputs = ["Cargo.lock"]

[ecosystems.rust.tasks.format-check]
argv = ["cargo", "fmt", "--manifest-path", "{module.manifest}", "--all", "--check", "{args}"]
fan_out = "whole-workspace"
kind = "format"
shared_inputs = ["Cargo.lock"]

[ecosystems.rust.tasks.lint]
argv = ["cargo", "clippy", "--manifest-path", "{module.manifest}", "{module.selector}", "{args}"]
fan_out = "batchable"
selector = ["-p", "{module.package}"]
shared_inputs = ["Cargo.lock"]

[ecosystems.rust.tasks.run]
argv = ["cargo", "run", "--manifest-path", "{module.manifest}", "{module.selector}", "{args}"]
fan_out = "per-module"
persistent = true
selector = ["-p", "{module.package}"]
shared_inputs = ["Cargo.lock"]

[ecosystems.rust.tasks.test]
argv = ["cargo", "nextest", "run", "--no-tests=pass", "--manifest-path", "{module.manifest}", "{module.selector}", "{args}"]
fan_out = "batchable"
selector = ["-p", "{module.package}"]
shared_inputs = ["Cargo.lock"]

[ecosystems.rust.tasks.vuln]
argv = ["cargo", "audit", "--file", "{workspace.root}/Cargo.lock", "{args}"]
fan_out = "whole-workspace"
shared_inputs = ["Cargo.lock"]

# The command ecosystem is Toven's generic-tool adapter: tool-specific but
# language-agnostic gates that have no cargo/go home. Declaring them here drives
# Toven's own `structure` (ast-grep) and `docs-build` (mdbook) gates through the
# task machinery instead of bespoke Makefile recipes. One module rooted at the
# repo root owns both. No explicit `[ecosystems.command.toolchain]` is declared:
# each gate is a distinct tool, so the adapter probes per addressed task
# (`ast-grep --version` for `structure`, `mdbook --version` for `docs-build`),
# giving each a typed missing-tool error without coupling the two.
[[ecosystems.command.modules]]
name = "repo"
root = "."

# ast-grep structural lint (the `mod.rs`/`lib.rs` declare-only guard). Argv is
# byte-identical to the Makefile recipe; `whole-workspace` runs it once.
[ecosystems.command.tasks.structure]
argv = ["ast-grep", "scan"]
fan_out = "whole-workspace"
kind = "lint"

# mdbook documentation build. Argv is byte-identical to the Makefile recipe;
# `kind = "doc"` groups it with the other documentation gates.
[ecosystems.command.tasks.docs-build]
argv = ["mdbook", "build", "docs"]
fan_out = "whole-workspace"
kind = "doc"
