# One comma token plans several tasks into one plan: `build,test` across two
# modules schedules four independent units in a single wave.
repo: command/multi-task
steps:
  - id: 01-plan-build-test
    argv: [--output, jsonl, plan, "build,test"]
    stdout: { match: exact }
  - id: 02-run-build-test
    argv: [--jobs, "1", "build,test"]
    stderr: { match: normalized }
