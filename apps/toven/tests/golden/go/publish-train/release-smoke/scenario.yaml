# Representative Go release smoke over a root+nested module train: plan, status,
# readiness, local evidence artifacts, dry-run, and publish approval guard.
#
# Fixture divergence (intentional): this Go publish-train is pre-tagged at
# v0.1.0 (root `v0.1.0` + nested `core/v0.1.0` below), so its baseline reads as
# up-to-date and the plan reflects only bumps beyond it. The Rust twin carries
# NO tags, so every module there is always planned — the two ecosystems
# deliberately exercise opposite release baselines.
repo: go/publish-train
requires: [go]
git:
  tags:
    - v0.1.0
    - core/v0.1.0
steps:
  - id: 01-release-plan-jsonl
    argv: [release, plan, --output, jsonl]
    # The train is pre-tagged and up to date, so JSONL plan output is zero
    # lines — the empty golden is the assertion, not a placeholder.
    stdout: { match: normalized }
  - id: 02-release-status
    argv: [release, status]
    stdout: { match: normalized }
  - id: 03-release-readiness
    argv: [release, readiness]
    stdout: { match: normalized }
  - id: 04-release-sbom
    argv: [release, sbom, --out-dir, out/sbom]
    # The go adapter shells out to the cyclonedx-gomod tool; runners without it
    # skip just this step green.
    requires: [cyclonedx-gomod]
    stdout: { match: normalized }
    # The command prints artifact paths; assert each file is actually written.
    effects:
      - file_exists: out/sbom/core.cdx.json
      - file_exists: out/sbom/train.cdx.json
  - id: 05-release-depgraphs
    argv: [release, depgraphs, --out-dir, out/depgraphs]
    stdout: { match: normalized }
    # The depgraph is emitted regardless of release baseline — assert the
    # printed path is a real file.
    effects:
      - file_exists: out/depgraphs/publish-train-go.dot
  - id: 06-release-publish-dry-run
    argv: [release, publish, --dry-run, --output, jsonl, --pre, alpha]
    stdout: { match: normalized }
    # --dry-run rehearses only: it must create no release tag. The root module
    # would tag `v0.2.0-alpha.1`; assert it is absent after the rehearsal.
    effects:
      - git_tag_absent: v0.2.0-alpha.1
  - id: 07-release-publish-requires-yes
    argv: [release, publish]
    exit: 2
    stderr: { match: normalized }
