# An up-to-date train has nothing to release: the human `release plan` prints an
# explicit "nothing to release" line on stdout rather than an empty table or a
# blank stream. (The go train is pre-tagged at v0.1.0 with no later changes.)
repo: go/publish-train
requires: [go]
git:
  tags:
    - v0.1.0
    - core/v0.1.0
steps:
  - id: 01-release-plan-empty
    argv: [release, plan]
    stdout: { match: normalized }
