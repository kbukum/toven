[package]
name = "toven"
description = "Toven — the umbrella CLI bundling the Rust, Go, and command adapters"
version = "0.1.0-alpha.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "toven"
path = "src/main.rs"
doc = false

[dependencies]
toven-cli.workspace = true
toven-ports.workspace = true
toven-rust.workspace = true
toven-go.workspace = true
toven-command.workspace = true
rskit-cli.workspace = true
rskit-errors.workspace = true

[features]
# Statically link a source-built OpenSSL into every adapter's rskit-git backend
# so the released binary carries its own OpenSSL. Enabled by the release
# workflow (`cargo build -p toven --features vendored-openssl`); off by default.
vendored-openssl = [
    "toven-cli/vendored-openssl",
    "toven-rust/vendored-openssl",
    "toven-go/vendored-openssl",
]

[dev-dependencies]
toven-testkit.workspace = true
libtest-mimic.workspace = true

# The zero-code golden suite: a libtest-mimic main that turns every
# `scenario.yaml` under `tests/golden/` into one reported test.
[[test]]
name = "golden"
harness = false

[lints]
workspace = true
