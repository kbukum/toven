[workspace]
resolver = "3"
members = ["crates/*"]
exclude = [
    "rskit",
    "crates/toven-testkit/fixtures/ecosystems/rust/workspaces/basic",
    "crates/toven-testkit/fixtures/repos/single-rust",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.94"
license = "MIT"
authors = ["Toven contributors"]
repository = "https://github.com/kbukum/toven"
homepage = "https://github.com/kbukum/toven"

# Centralized dependency versions so every member shares one source of truth.
# rskit crates are path deps into the checked-in submodule and are pinned to the
# submodule's prerelease version.
[workspace.dependencies]
rskit-errors = { version = "0.1.0-alpha.1", path = "rskit/core/rskit-errors" }
rskit-validation = { version = "0.1.0-alpha.1", path = "rskit/core/rskit-validation" }
rskit-util = { version = "0.1.0-alpha.1", path = "rskit/core/rskit-util" }
rskit-version = { version = "0.1.0-alpha.1", path = "rskit/core/rskit-version" }
rskit-fs = { version = "0.1.0-alpha.1", path = "rskit/core/rskit-fs" }
rskit-git = { version = "0.1.0-alpha.1", path = "rskit/core/rskit-git" }
rskit-testutil = { version = "0.1.0-alpha.1", path = "rskit/core/rskit-testutil" }
toven-model = { version = "0.1.0-alpha.1", path = "crates/toven-model" }
toven-ports = { version = "0.1.0-alpha.1", path = "crates/toven-ports" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_imports = "warn"
unused_variables = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
