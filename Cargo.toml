[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "examples/*"]
exclude = [
    "rskit",
    "crates/toven-testkit/fixtures/ecosystems/rust/workspaces/basic",
    "crates/toven-testkit/fixtures/ecosystems/rust/workspaces/single-crate",
    "crates/toven-testkit/fixtures/ecosystems/rust/workspaces/cross",
    "crates/toven-testkit/fixtures/ecosystems/rust/workspaces/broken",
    "crates/toven-testkit/fixtures/repos/single-rust",
    "crates/toven-testkit/fixtures/repos/workspace-inherited-rust",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.94"
license = "MIT"
authors = ["Toven contributors"]
repository = "https://github.com/kbukum/toven"
homepage = "https://github.com/kbukum/toven"

# Centralized dependency versions so every member shares one source of truth.
# rskit crates are path deps into the checked-in submodule and are pinned to the
# submodule's prerelease version.
[workspace.dependencies]
rskit-errors = { version = "0.1.0-alpha.1", path = "rskit/core/rskit-errors" }
rskit-validation = { version = "0.1.0-alpha.1", path = "rskit/core/rskit-validation" }
rskit-codec = { version = "0.1.0-alpha.1", path = "rskit/core/rskit-codec" }
rskit-git = { version = "0.1.0-alpha.2", path = "rskit/core/rskit-git" }
rskit-testutil = { version = "0.1.0-alpha.2", path = "rskit/core/rskit-testutil" }
rskit-util = { version = "0.1.0-alpha.3", path = "rskit/core/rskit-util" }
rskit-version = { version = "0.1.0-alpha.2", path = "rskit/core/rskit-version" }
rskit-fs = { version = "0.1.0-alpha.3", path = "rskit/core/rskit-fs" }
rskit-process = { version = "0.1.0-alpha.3", path = "rskit/core/rskit-process" }
rskit-worker = { version = "0.1.0-alpha.2", path = "rskit/core/rskit-worker" }
rskit-component = { version = "0.1.0-alpha.1", path = "rskit/core/rskit-component" }
rskit-config = { version = "0.1.0-alpha.4", path = "rskit/core/rskit-config", default-features = false }
rskit-cli = { version = "0.1.0-alpha.2", path = "rskit/core/rskit-cli" }
toven-model = { version = "0.1.0-alpha.1", path = "crates/toven-model" }
toven-ports = { version = "0.1.0-alpha.1", path = "crates/toven-ports" }
toven-engine = { version = "0.1.0-alpha.1", path = "crates/toven-engine" }
toven-cli = { version = "0.1.0-alpha.1", path = "crates/toven-cli" }
toven-rust = { version = "0.1.0-alpha.1", path = "crates/toven-rust" }
toven-go = { version = "0.1.0-alpha.1", path = "crates/toven-go" }
toven-command = { version = "0.1.0-alpha.1", path = "crates/toven-command" }
toven-testkit = { version = "0.1.0-alpha.1", path = "crates/toven-testkit" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
toml = "1.1"
toml_edit = "0.25"
cargo_metadata = "0.23"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_imports = "warn"
unused_variables = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = "line-tables-only"
# Keep debug info in the object files instead of running dsymutil on macOS; this
# meaningfully cuts link time for the many small integration-test binaries. (A
# no-op on Linux, where unpacked is already the default.)
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1
