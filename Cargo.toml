[package]
name = "toven"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.94"
license = "MIT"
authors = ["Toven contributors"]
repository = "https://github.com/kbukum/toven"
homepage = "https://github.com/kbukum/toven"
documentation = "https://docs.rs/toven"
description = "Fast, argv-first development and CI task planning for multi-module repositories"
readme = "README.md"
keywords = ["ci", "cli", "developer-tools", "task-runner"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[dependencies]
blake3 = "1"
cargo_metadata = "0.23.1"
clap = "4.5.50"
rskit-cache = { version = "0.1.0", path = "rskit/core/rskit-cache", features = ["fs"] }
rskit-config = { version = "0.1.0", path = "rskit/core/rskit-config" }
rskit-errors = { version = "0.1.0", path = "rskit/core/rskit-errors" }
rskit-fs = { version = "0.1.0", path = "rskit/core/rskit-fs", default-features = false }
rskit-git = { version = "0.1.0", path = "rskit/core/rskit-git" }
rskit-process = { version = "0.1.0", path = "rskit/core/rskit-process" }
rskit-validation = { version = "0.1.0", path = "rskit/core/rskit-validation" }
rskit-version = { version = "0.1.0", path = "rskit/core/rskit-version" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"

[dev-dependencies]
rskit-testutil = { version = "0.1.0", path = "rskit/core/rskit-testutil" }
toml = "1.1.2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_imports = "warn"
unused_variables = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
